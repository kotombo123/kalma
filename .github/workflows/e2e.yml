name: E2E
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start the whole stack (infra + apps)
        run: docker compose -f infra/docker-compose.yml --profile apps up -d --build
      - name: Wait for api, ingest and web
        run: |
          for url in http://localhost:3000/health http://localhost:3001/health http://localhost:5173; do
            for i in $(seq 1 90); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url"
          done
      - name: Seed demo data and reload workers
        run: |
          pnpm seed
          docker compose -f infra/docker-compose.yml --profile apps restart ingest worker notifier
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3001/health && break; sleep 2; done
      - run: pnpm --filter @alerting/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { CI: '1' }
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile apps logs --tail 200 api ingest worker notifier web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }
