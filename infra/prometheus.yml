global:
  scrape_interval: 5s
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ['api:3000'] }]
  - job_name: ingest
    static_configs: [{ targets: ['ingest:3001'] }]
  - job_name: worker
    static_configs: [{ targets: ['worker:9100'] }]
  - job_name: notifier
    static_configs: [{ targets: ['notifier:9100'] }]
  - job_name: demo-systems
    static_configs: [{ targets: ['demo-systems:3002'] }]
  # collector (#46) runs with host networking
  - job_name: collector
    static_configs: [{ targets: ['host.docker.internal:9598'] }]
  # apps started with `pnpm dev` on the host
  - job_name: host
    static_configs:
      - targets:
          [
            'host.docker.internal:3000',
            'host.docker.internal:3001',
            'host.docker.internal:9100',
            'host.docker.internal:9101',
          ]
